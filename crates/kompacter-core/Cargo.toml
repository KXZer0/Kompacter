[package]
name = "kompacter-core"
description = "Local compression engine for Kompacter: fit any file under an upload limit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
zip.workspace = true
# Shrinking pictures inside PDFs (no extras).
lopdf = { version = "0.47", default-features = false }
# 7z archives (LZMA2), for the "7z" archive format. Compression only.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "util"] }

[dev-dependencies]
lopdf = { version = "0.47", default-features = false }
