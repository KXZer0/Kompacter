[workspace]
resolver = "2"
members = ["crates/kompacter-core", "crates/kompacter-cli"]
# The desktop app needs platform webview libraries, so it builds on its own.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/KXZer0/Kompacter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
