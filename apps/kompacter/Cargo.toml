[package]
name = "kompacter"
description = "Kompacter: shrink any file to fit an upload limit. Tray app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "Kompacter"
path = "src/main.rs"

[dependencies]
kompacter-core = { path = "../../crates/kompacter-core" }
serde.workspace = true
serde_json.workspace = true
# The UI. GPU drawing (femtovg) for smooth animations, CPU drawing ("software") for
# Low-memory mode and as the automatic fallback.
slint = { version = "1.18", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-femtovg",
  "renderer-software",
  "software-renderer-path",
  "software-renderer-systemfonts",
  "system-tray",
  "accessibility",
  "unstable-winit-030",
  "raw-window-handle-06",
] }

# Native "choose file / folder" dialogs.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# Same Windows bindings Slint already uses (no extra copy).
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"
