[package]
name = "kompacter"
description = "Kompacter: shrink any file to fit an upload limit. Tray app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "Kompacter"
path = "src/main.rs"

[dependencies]
kompacter-core = { path = "../../crates/kompacter-core" }
serde.workspace = true
serde_json.workspace = true
# Checking downloaded updates (SHA-256).
sha2 = "0.11"
tempfile.workspace = true
slint = { version = "1.19", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "system-tray",
  "accessibility",
  "unstable-winit-030",
  "raw-window-handle-06",
] }

# Native "choose file / folder" dialogs.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
libc = "0.2"
url = "2"
# Already built for Slint's X11 backend: find the free screen area beside the tray.
x11rb = { version = "0.13", features = ["randr", "resource_manager"] }
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Share the D-Bus dependency used by the Slint tray backend.
zbus = "5"

[target.'cfg(not(windows))'.dependencies]
slint = { version = "1.19", default-features = false, features = [
  "renderer-femtovg",
  "renderer-software",
  "software-renderer-path",
  "software-renderer-systemfonts",
] }

[target.'cfg(windows)'.dependencies]
slint = { version = "1.19", default-features = false, features = ["renderer-skia"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSButton",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSPasteboard",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
  "NSWorkspace",
  "libc",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSError",
  "NSFileManager",
  "NSPathUtilities",
  "NSString",
  "NSURL",
] }
# Open at login (SMAppService, macOS 13+).
objc2-service-management = { version = "0.3", default-features = false, features = [
  "std",
  "objc2",
  "objc2-foundation",
  "SMAppService",
] }

# Same Windows bindings Slint already uses (no extra copy).
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
i-slint-backend-testing = "1.19"

[build-dependencies]
slint-build = "1.19"
embed-resource = "3"
