name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine + app (tests + lint, Linux)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        # ffmpeg for the engine tests; fontconfig so the app (Slint) builds on Linux.
        # The runner's preinstalled Microsoft package source isn't needed here, and when
        # it is unavailable it makes the whole update fail, so leave it out.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfontconfig-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  app:
    name: App (Windows build + lint + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p kompacter --all-targets -- -D warnings
      - run: cargo test --locked -p kompacter
