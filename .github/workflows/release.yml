name: Release

# Push a tag like v0.1.0 (or run it by hand) to build the Windows installer.
# The result is a DRAFT GitHub Release: check it, then press Publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install UI dependencies
        working-directory: apps/desktop/ui
        run: npm ci

      # ffmpeg ships inside the installer so users don't install anything.
      # GPL build (includes x264); its license goes into the install folder.
      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          $dest = "apps/desktop/src-tauri/binaries"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$bin/ffmpeg.exe"  "$dest/ffmpeg-x86_64-pc-windows-msvc.exe"
          Copy-Item "$bin/ffprobe.exe" "$dest/ffprobe-x86_64-pc-windows-msvc.exe"
          $license = Get-ChildItem ffmpeg-dl -Recurse -Filter LICENSE.txt | Select-Object -First 1
          Copy-Item $license.FullName "$dest/FFMPEG-LICENSE.txt"

      # The installer takes its version from the tag: v0.0.2-test -> 0.0.2.
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v").Split("-")[0]
          @{ version = $v } | ConvertTo-Json | Set-Content tauri.version.conf.json

      - name: Build installer
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path tauri.version.conf.json) { $extra = @("--config", "tauri.version.conf.json") }
          npx --yes @tauri-apps/cli@2 build --config tauri.release.conf.json @extra

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # Tags with a dash (v0.0.2-test) are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
