name: macOS review build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: macOS app bundle and media fixture
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bundle media tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ffmpeg
      - run: cargo clippy --locked -p kompacter --all-targets -- -D warnings
      - name: Verify local file URL handling
        run: cargo test --locked -p kompacter platform::macos::tests
      - name: Build the review bundle
        run: packaging/macos/build-app.sh
      - name: Compress an actual video with the bundled tools
        run: |
          cargo build --locked -p kompacter-cli
          review="$RUNNER_TEMP/Kompacter review"
          ditto -x -k target/macos/Kompacter-*.zip "$review"
          packaging/macos/smoke.sh "$review/Kompacter.app" target/debug/kompacter
      - name: Build the review DMG
        run: |
          packaging/macos/make-dmg.sh target/macos/Kompacter.app target/macos/Kompacter-review-macos-arm64.dmg
          mount="$RUNNER_TEMP/Kompacter DMG"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" target/macos/Kompacter-review-macos-arm64.dmg
          test -L "$mount/Applications"
          codesign --verify --deep --strict "$mount/Kompacter.app"
          hdiutil detach "$mount"
      # The app's own update step on this DMG: mount it, replace a stand-in app, verify.
      - name: Update from the review DMG
        env:
          KOMPACTER_UPDATE_FILE: target/macos/Kompacter-review-macos-arm64.dmg
        run: cargo test --locked -p kompacter update_end_to_end -- --ignored --nocapture
      # Screenshots of the real app for review. Never fails the job: a runner without a
      # usable screen just produces no pictures.
      - name: Screenshot the app
        continue-on-error: true
        run: |
          shots="$RUNNER_TEMP/screenshots"
          mkdir -p "$shots"
          app="$RUNNER_TEMP/Kompacter review/Kompacter.app"
          ffmpeg -v error -y -f lavfi -i testsrc2=size=1920x1080:rate=60:duration=30 \
            -f lavfi -i sine=duration=30 -c:v libx264 -b:v 12M -c:a aac "$shots/gameclip.mp4"
          # Start on the main screen (onboarding finished) so the recording shows the panel.
          prefs="$HOME/Library/Application Support/app.kompacter.desktop"
          mkdir -p "$prefs"
          echo '{"welcomed": true}' > "$prefs/settings.json"
          # A desktop picture instead of the runner's black background.
          picture=$(ls /System/Library/Desktop\ Pictures/*.heic 2>/dev/null | head -n 1)
          if [ -n "$picture" ]; then
            osascript -e "tell application \"System Events\" to tell every desktop to set picture to \"$picture\"" || true
          fi
          sleep 2
          # Start Kompacter first (a fresh Mac checks a new app for several seconds), then
          # hide the panel by switching to Finder, so the recording shows a Dock click.
          open "$app"
          sleep 12
          osascript -e 'tell application "Finder" to activate' || true
          sleep 3
          # Record the mouse travelling to Kompacter's Dock icon and the panel opening above
          # it. Opening the running app again sends the same reopen event as a Dock click.
          screencapture -v -C -V 14 -x "$shots/dock.mov" &
          recorder=$!
          sleep 1
          swift -e 'import AppKit
          let f = NSScreen.main!.frame
          let from = CGPoint(x: f.width * 0.6, y: f.height * 0.45)
          let to = CGPoint(x: f.width * 0.84, y: f.height - 30)
          for i in 0...40 {
            let t = Double(i) / 40
            let e = 1 - pow(1 - t, 3)
            CGWarpMouseCursorPosition(CGPoint(x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e))
            usleep(20000)
          }' || true
          sleep 0.5
          open "$app"
          wait "$recorder" || true
          echo "Kompacter processes (expect exactly one):"
          pgrep -fl 'Kompacter.app/Contents/MacOS/Kompacter' || true
          if [ -s "$shots/dock.mov" ]; then
            # The whole desktop, like the README's Windows and Linux recordings.
            ffmpeg -v error -y -i "$shots/dock.mov" -vf "fps=12,mpdecimate=hi=512:lo=256:frac=0.0001,setpts=N/12/TB,scale=960:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=96:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle" -loop 0 "$shots/macos.gif"
            rm "$shots/dock.mov"
          fi
          screencapture -x "$shots/1-launch.png"
          screencapture -x -R 0,0,1920,40 "$shots/2-menu-bar.png" || true
          open -a "$app" "$shots/gameclip.mp4"
          sleep 8
          screencapture -x "$shots/3-file-opened.png"
          rm "$shots/gameclip.mp4"
          for f in "$shots"/*.png; do
            sips -Z 1600 -s format jpeg -s formatOptions 70 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "SHOT-BEGIN $(basename "${f%.png}")"
            base64 -i "${f%.png}.jpg" | fold -w 900 | sed 's/^/SHOT:/'
            echo "SHOT-END"
          done
          osascript -e 'quit app "Kompacter"' || pkill -x Kompacter || true
          # Last in the log, so even a shortened log keeps all of it.
          if [ -s "$shots/macos.gif" ]; then
            ls -l "$shots/macos.gif"
            echo "GIF-BEGIN macos"
            base64 -i "$shots/macos.gif" | fold -w 900 | sed 's/^/GIF:/'
            echo "GIF-END"
          fi
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kompacter-macos-screenshots
          path: |
            ${{ runner.temp }}/screenshots/*.png
            ${{ runner.temp }}/screenshots/*.gif
          if-no-files-found: warn
      - name: Keep the review bundle
        uses: actions/upload-artifact@v7
        with:
          name: kompacter-macos-review
          path: |
            target/macos/Kompacter-*.zip
            target/macos/Kompacter-*.dmg
            target/macos/SHA256SUMS
          if-no-files-found: error
